name: Build Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: ./build_mac.sh
            artifact_name: DeptAllocation-macOS
            artifact_path: |
              dist/DeptAllocation.app
              dist/DeptAllocation.zip
          - os: windows-latest
            script: ./build_windows.sh
            artifact_name: DeptAllocation-Windows
            artifact_path: dist/DeptAllocation.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure build scripts are executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x ./build_mac.sh ./build_windows.sh

      - name: Build
        shell: bash
        run: ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
